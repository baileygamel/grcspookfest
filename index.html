<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spookfest Avatar Maker</title>
<style>
  :root {
    --bg: #0a0018;
    --bg2: #3a0050;
    --neon-p: #ff4dff;
    --neon-o: #ff8a00;
    --neon-g: #38c25a;
    --neon-v: #7a3fff;
    --neon-y: #ffe94d;
    --ink: #f6f0ff;
    --panel: #1a0028;
    --panel-edge: #5a1a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: "Courier New", ui-monospace, monospace;
    color: var(--ink);
    background:
      radial-gradient(ellipse at 15% 5%, rgba(255,138,0,0.28), transparent 55%),
      radial-gradient(ellipse at 85% 95%, rgba(122,63,255,0.35), transparent 55%),
      linear-gradient(180deg, #0a0018 0%, #2a002a 60%, #0a0018 100%);
    background-attachment: fixed;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 100;
  }
  h1, h2, h3, .pixel {
    font-family: "Press Start 2P", "Courier New", monospace;
    letter-spacing: 1px;
  }

  header { text-align: center; padding: 24px 16px 8px; }
  header h1 {
    margin: 0;
    font-size: clamp(20px, 4vw, 34px);
    color: var(--neon-o);
    text-shadow:
      0 0 6px var(--neon-o),
      0 0 22px rgba(255,138,0,0.8),
      3px 3px 0 #4a1400;
  }
  header .sub {
    margin-top: 10px;
    color: var(--neon-p);
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    text-shadow: 0 0 6px rgba(255,77,255,0.8);
  }

  #app { max-width: 1180px; margin: 0 auto; padding: 12px 16px 48px; }

  .creator {
    display: grid;
    grid-template-columns: minmax(320px, 1fr) minmax(320px, 1.1fr);
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 820px) { .creator { grid-template-columns: 1fr; } }

  .stage-wrap { position: sticky; top: 12px; }
  .crt {
    background: #000;
    border: 6px solid #2a0044;
    border-radius: 22px;
    box-shadow:
      inset 0 0 60px rgba(255,77,255,0.25),
      0 0 0 4px #7a1a5a,
      0 0 34px rgba(255,138,0,0.4);
    padding: 14px;
    position: relative;
  }
  .crt::after {
    content: "";
    position: absolute; inset: 14px;
    border-radius: 12px;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.06) 0px,
      rgba(255,255,255,0.06) 1px,
      transparent 1px,
      transparent 3px);
    pointer-events: none;
    mix-blend-mode: overlay;
  }
  #avatarSvg {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    border-radius: 8px;
    background: #000;
  }
  .stage-caption {
    text-align: center;
    margin-top: 10px;
    color: var(--neon-o);
    font-family: "Press Start 2P", monospace;
    font-size: 9px;
    text-shadow: 0 0 6px rgba(255,138,0,0.7);
  }

  .go-btn {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 16px;
    font-family: "Press Start 2P", monospace;
    font-size: 14px;
    color: #1a0a00;
    background: linear-gradient(180deg, #ffdb4d, #ff7a00);
    border: 4px solid #4a1400;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 6px 0 #2a0800, 0 0 30px rgba(255,138,0,0.7);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .go-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #2a0800, 0 0 42px rgba(255,138,0,0.9); }
  .go-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #2a0800; }

  .controls {
    background: rgba(20,0,40,0.65);
    border: 3px solid var(--panel-edge);
    border-radius: 16px;
    padding: 14px;
    backdrop-filter: blur(4px);
  }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  .tab {
    flex: 1 1 auto;
    padding: 8px 6px;
    font-family: "Press Start 2P", monospace;
    font-size: 9px;
    color: var(--ink);
    background: #22004a;
    border: 2px solid #5a1a5a;
    border-radius: 8px;
    cursor: pointer;
  }
  .tab.active {
    background: var(--neon-o);
    color: #1a0a00;
    box-shadow: 0 0 12px rgba(255,138,0,0.9);
    border-color: #ffbd4d;
  }
  .section { display: none; }
  .section.active { display: block; }
  .section h3 {
    margin: 6px 0 10px;
    font-size: 11px;
    color: var(--neon-g);
    text-shadow: 0 0 6px rgba(56,194,90,0.6);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
    gap: 8px;
    margin-bottom: 14px;
  }
  .swatch {
    padding: 8px 6px;
    background: #150028;
    border: 2px solid #5a1a5a;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    font-size: 10px;
    font-family: "Press Start 2P", monospace;
    color: var(--ink);
    transition: transform 0.08s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .swatch:hover { transform: translateY(-2px); }
  .swatch.active {
    border-color: var(--neon-o);
    box-shadow: 0 0 12px rgba(255,138,0,0.7);
    background: #2a0044;
  }
  .swatch .chip {
    width: 100%;
    height: 22px;
    border-radius: 4px;
    border: 2px solid #000;
  }

  #result { display: none; }
  #result.show { display: block; }
  .poster-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  #poster {
    width: 100%;
    max-width: 720px;
    aspect-ratio: 4 / 5;
    background: #0a0018;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(255,77,255,0.4);
  }
  #poster svg { width: 100%; height: 100%; display: block; }
  .poster-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    padding: 12px 18px;
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    border-radius: 10px;
    cursor: pointer;
    border: 3px solid;
    text-decoration: none;
    display: inline-block;
  }
  .btn.primary {
    background: var(--neon-o);
    color: #1a0800;
    border-color: #4a1400;
    box-shadow: 0 4px 0 #2a0800, 0 0 20px rgba(255,138,0,0.7);
  }
  .btn.secondary {
    background: #22004a;
    color: var(--ink);
    border-color: var(--neon-v);
    box-shadow: 0 4px 0 #2a0044;
  }
  .btn:active { transform: translateY(3px); box-shadow: none !important; }

  .footnote {
    color: #c4a0e0;
    font-size: 11px;
    text-align: center;
    max-width: 520px;
    margin-top: 4px;
  }
</style>
</head>
<body>

<header>
  <h1>SPOOKFEST AVATAR MAKER</h1>
  <div class="sub">INSERT COIN &middot; PRESS START &middot; MAKE A FIT</div>
</header>

<main id="app">

  <!-- CREATOR SCREEN -->
  <section id="creator" class="creator">
    <div class="stage-wrap">
      <div class="crt">
        <svg id="avatarSvg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="stage-caption">PLAYER 1 &middot; READY?</div>
      <button class="go-btn" id="goBtn">I'M GOING! &nbsp;&#x2192;</button>
    </div>

    <div class="controls">
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="face">FACE</button>
        <button class="tab" data-tab="hair">HAIR</button>
        <button class="tab" data-tab="wear">WEAR</button>
        <button class="tab" data-tab="extras">EXTRAS</button>
        <button class="tab" data-tab="scene">SCENE</button>
      </div>

      <div class="section active" data-section="face">
        <h3>SKIN TONE</h3>
        <div class="grid" data-group="skin"></div>
        <h3>EYES</h3>
        <div class="grid" data-group="eyes"></div>
        <h3>MOUTH</h3>
        <div class="grid" data-group="mouth"></div>
      </div>

      <div class="section" data-section="hair">
        <h3>HAIR STYLE</h3>
        <div class="grid" data-group="hair"></div>
        <h3>HAIR COLOR</h3>
        <div class="grid" data-group="hairColor"></div>
      </div>

      <div class="section" data-section="wear">
        <h3>OUTFIT</h3>
        <div class="grid" data-group="outfit"></div>
        <h3>OUTFIT COLOR</h3>
        <div class="grid" data-group="outfitColor"></div>
      </div>

      <div class="section" data-section="extras">
        <h3>HEADGEAR</h3>
        <div class="grid" data-group="hat"></div>
        <h3>SIDEKICK</h3>
        <div class="grid" data-group="prop"></div>
      </div>

      <div class="section" data-section="scene">
        <h3>BACKGROUND</h3>
        <div class="grid" data-group="scene"></div>
      </div>
    </div>
  </section>

  <!-- RESULT SCREEN -->
  <section id="result">
    <div class="poster-wrap">
      <div id="poster"></div>
      <div class="poster-actions">
        <button class="btn primary" id="downloadBtn">DOWNLOAD PNG</button>
        <button class="btn secondary" id="editBtn">&#x2190; EDIT AVATAR</button>
      </div>
      <p class="footnote">Save the PNG and drop it in the shared marketing folder, or screenshot the poster to share.</p>
    </div>
  </section>

</main>

<script>
/* =========================================================
   SPOOKFEST AVATAR MAKER — Halloween Edition
   Smoother vector art, retro-80s neon grid, Halloween palette.
   All drawing in a 200x200 viewBox.
   ========================================================= */

const INK = "#0a0018";        // near-black outline
const WHITE = "#f6f0ff";
const PINK = "#ff4dff";
const NEON_O = "#ff8a00";
const NEON_G = "#38c25a";
const NEON_V = "#7a3fff";
const NEON_Y = "#ffe94d";

/* ---------- Halloween palettes ---------- */
const SKIN_COLORS = {
  pale:    "#efd8c1",
  tan:     "#c99168",
  brown:   "#8a5230",
  deep:    "#4a2a18",
  zombie:  "#8ec86a",
  vampire: "#dcc9f5",
  ghost:   "#f0eaff",
};
const HAIR_COLORS = {
  black:   "#141026",
  pumpkin: "#ff7a00",
  witch:   "#7a3fff",
  slime:   "#38c25a",
  blood:   "#a01c1c",
  silver:  "#c9c9e0",
  bone:    "#f0e4c4",
};
const OUTFIT_COLORS = {
  pumpkin: "#ff7a00",
  purple:  "#5a2fa8",
  midnight:"#141026",
  poison:  "#38c25a",
  blood:   "#a01c1c",
  bone:    "#f0e4c4",
};

const HAIR_STYLES   = ["short","long","mohawk","bun","curly","spikes","ponytail","pigtails","pompadour","bald"];
const EYE_STYLES    = ["normal","shades","glasses","wink","stare","wide","sleepy","x_eyes"];
const MOUTH_STYLES  = ["smile","smirk","fangs","stache","tongue","frown","scream","grin","kiss"];
const OUTFIT_STYLES = ["tee","hoodie","suit","cape","tank","skeleton","robe"];
const HAT_STYLES    = ["none","cap","witch","crown","horns","halo"];
const PROP_STYLES   = ["none","coffee","laptop","ghost","pumpkin","sword","bat"];
const SCENES = {
  arcade:   { name: "SUNSET" },
  cemetery: { name: "GRAVES" },
  denver:   { name: "DENVER" },
  haunted:  { name: "HAUNT" },
  neon:     { name: "NEON CITY" },
};

/* ---------- state ---------- */
const state = {
  skin: "pale",
  hair: "short",
  hairColor: "black",
  eyes: "normal",
  mouth: "smile",
  outfit: "tee",
  outfitColor: "pumpkin",
  hat: "none",
  prop: "none",
  scene: "arcade",
};

/* ---------- shape helpers ---------- */
function darker(hex, amt = 0.7) {
  const c = hex.replace("#", "");
  const r = Math.round(parseInt(c.substr(0,2),16) * amt);
  const g = Math.round(parseInt(c.substr(2,2),16) * amt);
  const b = Math.round(parseInt(c.substr(4,2),16) * amt);
  return "#" + [r,g,b].map(v => v.toString(16).padStart(2,"0")).join("");
}
function el(cx, cy, rx, ry, fill, stroke = INK, sw = 1.6) {
  return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
}
function ci(cx, cy, r, fill, stroke = INK, sw = 1.6) {
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
}
function rr(x, y, w, h, r, fill, stroke = INK, sw = 1.6) {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" ry="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
}
function pa(d, fill, stroke = INK, sw = 1.6) {
  return `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>`;
}
function ln(x1, y1, x2, y2, stroke, sw = 1.6, opacity = 1) {
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${sw}" opacity="${opacity}" stroke-linecap="round"/>`;
}

/* =========================================================
   RETRO 80s GRID SCENE (always drawn — the vibe)
   Character sits at x 55–145, y 35–200.
   ========================================================= */
function drawScene(name) {
  let out = "";
  out += `<defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0028"/>
      <stop offset="0.55" stop-color="#5a1466"/>
      <stop offset="1" stop-color="#a02040"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe94d"/>
      <stop offset="0.5" stop-color="#ff8a00"/>
      <stop offset="1" stop-color="#c91a4a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22004a"/>
      <stop offset="1" stop-color="#0a0018"/>
    </linearGradient>
  </defs>`;

  // sky
  out += `<rect x="0" y="0" width="200" height="132" fill="url(#sky)"/>`;

  // scene-specific elements BEHIND the sun/character
  if (name === "cemetery") {
    // Moon on the upper right
    out += ci(170, 25, 14, "#f0eaff", INK, 1.4);
    out += ci(174, 22, 3, "#c9c9e0", "none", 0);
    out += ci(166, 28, 2.5, "#c9c9e0", "none", 0);
    // bats
    out += pa("M 20 45 q 3 -4 6 0 q 3 -4 6 0", "none", INK, 1.2);
    out += pa("M 35 30 q 2 -3 4 0 q 2 -3 4 0", "none", INK, 1);
  } else if (name === "denver") {
    // mountain range silhouette across the horizon
    out += pa("M 0 118 L 18 92 L 30 108 L 48 80 L 62 100 L 80 74 L 100 96 L 122 78 L 140 100 L 158 82 L 178 104 L 200 90 L 200 132 L 0 132 Z", "#2a0844", INK, 1.4);
    // snow caps
    out += pa("M 78 76 L 80 74 L 82 78 Z", "#f0eaff", "none", 0);
    out += pa("M 120 80 L 122 78 L 124 82 Z", "#f0eaff", "none", 0);
    out += pa("M 156 84 L 158 82 L 160 86 Z", "#f0eaff", "none", 0);
  } else if (name === "haunted") {
    // moon
    out += ci(30, 30, 15, "#ffbd4d", INK, 1.4);
    // haunted house on right
    out += pa("M 145 105 L 145 65 L 152 65 L 152 55 L 160 55 L 160 40 L 172 25 L 184 40 L 184 55 L 192 55 L 192 65 L 200 65 L 200 105 Z", "#0a0018", "#3a1a4a", 1.4);
    // windows
    out += rr(158, 72, 8, 10, 1, "#ffbd4d", INK, 1);
    out += rr(178, 72, 8, 10, 1, "#ffbd4d", INK, 1);
    // door
    out += rr(168, 90, 10, 15, 1, "#3a1a0a", INK, 1);
    // bat
    out += pa("M 60 40 q 3 -4 6 0 q 3 -4 6 0", "none", INK, 1.2);
  } else if (name === "neon") {
    // skyscraper skyline
    const bldgs = [
      [0, 68, 14, 64], [14, 84, 18, 48], [32, 55, 20, 77],
      [52, 78, 16, 54], [148, 70, 18, 62], [166, 55, 16, 77],
      [182, 82, 18, 50],
    ];
    for (const [x,y,w,h] of bldgs) {
      out += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#0a0018" stroke="${INK}" stroke-width="1"/>`;
      for (let wy = y + 4; wy < y + h - 3; wy += 5) {
        for (let wx = x + 2; wx < x + w - 2; wx += 4) {
          const on = ((wx * 13 + wy * 7) % 5) === 0;
          const color = ((wx + wy) % 3 === 0) ? "#4de3ff" : "#ff4dff";
          if (on) out += `<rect x="${wx}" y="${wy}" width="2" height="2" fill="${color}"/>`;
        }
      }
    }
  }

  // The retro 80s sun (always drawn — this is the vibe the user loves)
  out += ci(100, 78, 34, "url(#sun)", INK, 1.4);
  // sun stripes (horizontal bars cutting the sun)
  const stripeYs = [82, 89, 96, 102, 108];
  for (const sy of stripeYs) {
    const dy = sy - 78;
    if (Math.abs(dy) < 34) {
      const half = Math.sqrt(34 * 34 - dy * dy) - 2;
      out += `<rect x="${100 - half}" y="${sy}" width="${2 * half}" height="1.8" fill="#1a0028"/>`;
    }
  }

  // arcade extras
  if (name === "arcade") {
    const stars = [[18,22],[36,14],[70,26],[130,20],[164,14],[180,28],[10,50],[190,44]];
    for (const [x,y] of stars) {
      out += `<rect x="${x}" y="${y}" width="2" height="2" fill="#ffe94d"/>`;
    }
  }

  // ground horizon band
  out += `<rect x="0" y="130" width="200" height="4" fill="#ff4dff"/>`;
  out += `<rect x="0" y="134" width="200" height="66" fill="url(#ground)"/>`;

  // RETRO GRID FLOOR — perspective (horizontals + verticals to vanishing point)
  // horizontals with increasing spacing toward the front
  for (let i = 1; i <= 9; i++) {
    const t = i / 9;
    const y = 134 + Math.pow(t, 1.7) * 66;
    if (y > 200) break;
    out += ln(0, y, 200, y, "#ff4dff", 0.55, 0.45 + t * 0.5);
  }
  // verticals converging to (100, 130)
  for (let i = -9; i <= 9; i++) {
    const bx = 100 + i * 26;
    out += ln(bx, 200, 100, 130, "#ff4dff", 0.5, 0.75);
  }

  // cemetery ground overlay (gravestones on floor)
  if (name === "cemetery") {
    // left gravestone
    out += pa("M 12 172 L 12 156 Q 12 150 18 150 Q 24 150 24 156 L 24 172 Z", "#5a5a70", INK, 1.4);
    out += `<text x="14" y="167" font-family="serif" font-size="6" fill="#0a0018" font-weight="bold">RIP</text>`;
    // right gravestone
    out += rr(174, 158, 18, 20, 3, "#5a5a70", INK, 1.4);
    out += `<text x="176" y="171" font-family="serif" font-size="6" fill="#0a0018" font-weight="bold">RIP</text>`;
    // tiny mound
    out += pa("M 30 195 Q 42 186 54 195 Z", "#2a1a2a", INK, 1);
  }

  return out;
}

/* =========================================================
   BODY / OUTFIT — sits under the neck (y ≥ 130)
   ========================================================= */
function drawBody(style, colorKey, skinKey) {
  const c = OUTFIT_COLORS[colorKey];
  const cd = darker(c, 0.7);
  const s = SKIN_COLORS[skinKey];
  const sd = darker(s, 0.85);
  let out = "";

  // Prop that goes BEHIND body (drawn from buildAvatarInner order actually)

  if (style === "tee") {
    // torso
    out += pa("M 55 148 Q 55 138 70 136 L 130 136 Q 145 138 145 148 L 148 200 L 52 200 Z", c);
    // sleeves
    out += pa("M 55 148 L 44 168 Q 40 172 46 174 L 60 172 L 60 148 Z", c);
    out += pa("M 145 148 L 156 168 Q 160 172 154 174 L 140 172 L 140 148 Z", c);
    // arms (skin)
    out += pa("M 44 172 L 40 195 Q 42 199 48 198 L 56 174 Z", s);
    out += pa("M 156 172 L 160 195 Q 158 199 152 198 L 144 174 Z", s);
    // neckline
    out += pa("M 88 136 Q 100 145 112 136", "none", INK, 1.6);
  } else if (style === "hoodie") {
    // hood collar
    out += pa("M 70 130 Q 60 138 60 148 L 60 155 Q 65 138 100 136 Q 135 138 140 155 L 140 148 Q 140 138 130 130 Z", cd);
    // torso
    out += pa("M 55 152 Q 55 142 70 140 L 130 140 Q 145 142 145 152 L 148 200 L 52 200 Z", c);
    // arm sleeves
    out += pa("M 55 152 L 40 195 Q 44 200 52 198 L 62 156 Z", c);
    out += pa("M 145 152 L 160 195 Q 156 200 148 198 L 138 156 Z", c);
    // pocket
    out += pa("M 78 170 L 122 170 L 118 188 L 82 188 Z", cd);
    // drawstrings
    out += ln(94, 138, 94, 155, INK, 1.4);
    out += ln(106, 138, 106, 155, INK, 1.4);
  } else if (style === "suit") {
    // jacket (darker)
    out += pa("M 55 145 Q 55 138 70 136 L 130 136 Q 145 138 145 145 L 148 200 L 52 200 Z", cd);
    // sleeves
    out += pa("M 55 145 L 40 195 Q 44 200 52 198 L 62 148 Z", cd);
    out += pa("M 145 145 L 160 195 Q 156 200 148 198 L 138 148 Z", cd);
    // shirt
    out += pa("M 88 136 L 112 136 L 112 200 L 88 200 Z", "#f6f0ff");
    // lapels
    out += pa("M 82 136 L 100 152 L 88 165 Z", c);

/* =========================================================

    out += ci(L, Y+1, 3, "#141026", "none", 0);

/* =========================================================
   PROP / SIDEKICK — sits to the side of the character
   ========================================================= */
function drawProp(style, layer) {
  if (style === "none") return "";

  if (layer === "back") {
    if (style === "ghost") {

      const gx = 168, gy = 105;
      out += pa(`M ${gx-14} ${gy-10} Q ${gx-14} ${gy-24} ${gx} ${gy-24} Q ${gx+14} ${gy-24} ${gx+14} ${gy-10} L ${gx+14} ${gy+10} Q ${gx+11} ${gy+6} ${gx+7} ${gy+10} Q ${gx+3} ${gy+6} ${gx} ${gy+10} Q ${gx-3} ${gy+6} ${gx-7} ${gy+10} Q ${gx-11} ${gy+6} ${gx-14} ${gy+10} Z`, "#f0eaff", INK, 1.4);
      out += ci(gx-4, gy-12, 2, INK, "none", 0);

      out += pa(`M ${gx-3} ${gy-6} Q ${gx} ${gy-3} ${gx+3} ${gy-6}`, "none", INK, 1);
    } else if (style === "bat") {
      // bat sits behind on left
      const bx = 32, by = 88;
      out += pa(`M ${bx} ${by} L ${bx-14} ${by-6} L ${bx-10} ${by-2} L ${bx-16} ${by+4} L ${bx-6} ${by+4} L ${bx-4} ${by+8} L ${bx} ${by+6} L ${bx+4} ${by+8} L ${bx+6} ${by+4} L ${bx+16} ${by+4} L ${bx+10} ${by-2} L ${bx+14} ${by-6} L ${bx} ${by} Z`, "#141026", INK, 1.4);
      out += ci(bx-2, by, 1, "#ff4dff", "none", 0);
      out += ci(bx+2, by, 1, "#ff4dff", "none", 0);
    }
  }
  if (layer === "front") {
    if (style === "coffee") {
      const cx = 168, cy = 168;
      out += rr(cx-10, cy-10, 20, 22, 2, "#f6f0ff", INK, 1.4);
      out += rr(cx-10, cy-10, 20, 4, 1, "#5a3618", INK, 1);
      out += pa(`M ${cx+10} ${cy-4} Q ${cx+18} ${cy} ${cx+10} ${cy+6}`, "none", INK, 1.4);
      // steam
      out += pa(`M ${cx-4} ${cy-14} q 3 -6 6 0 q 3 -6 6 0`, "none", "#f6f0ff", 1.2);
      // label
      out += `<text x="${cx}" y="${cy+6}" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="4" fill="${INK}">GRC</text>`;
    } else if (style === "laptop") {
      const lx = 168, ly = 168;
      // screen
      out += rr(lx-14, ly-14, 28, 18, 2, "#141026", INK, 1.4);
      out += rr(lx-12, ly-12, 24, 14, 1, "#4de3ff", "none", 0);
      out += rr(lx-10, ly-10, 20, 3, 1, WHITE, "none", 0);
      out += rr(lx-10, ly-6, 14, 2, 1, "#ff4dff", "none", 0);
      // base
      out += pa(`M ${lx-16} ${ly+4} L ${lx+16} ${ly+4} L ${lx+18} ${ly+8} L ${lx-18} ${ly+8} Z`, "#5a5a70", INK, 1.4);
    } else if (style === "pumpkin") {
      const px = 168, py = 176;
      out += el(px, py, 14, 12, "#ff7a00", INK, 1.6);
      out += pa(`M ${px-8} ${py-4} L ${px-2} ${py-5} L ${px-5} ${py+2} Z`, "#141026", "none", 0);
      out += pa(`M ${px+8} ${py-4} L ${px+2} ${py-5} L ${px+5} ${py+2} Z`, "#141026", "none", 0);
      out += pa(`M ${px-7} ${py+3} L ${px+7} ${py+3} L ${px+5} ${py+7} L ${px-5} ${py+7} Z`, "#141026", "none", 0);
      out += rr(px-1, py-14, 3, 6, 1, "#38c25a", INK, 1);
      // ridges
      out += pa(`M ${px-8} ${py-8} Q ${px-8} ${py+8} ${px-4} ${py+10}`, "none", "#c94a00", 1);
      out += pa(`M ${px+8} ${py-8} Q ${px+8} ${py+8} ${px+4} ${py+10}`, "none", "#c94a00", 1);
    } else if (style === "sword") {
      const sx = 168, sy = 158;
      // blade
      out += pa(`M ${sx-2} ${sy-18} L ${sx+2} ${sy-18} L ${sx+3} ${sy+14} L ${sx-3} ${sy+14} Z`, "#c9c9d8", INK, 1.4);
      out += pa(`M ${sx-2} ${sy-18} L ${sx+2} ${sy-18} L ${sx} ${sy-24} Z`, "#c9c9d8", INK, 1.4);
      // guard
      out += rr(sx-9, sy+14, 18, 4, 1, NEON_Y, INK, 1.2);
      // handle
      out += rr(sx-2, sy+18, 4, 10, 1, "#5a2a0a", INK, 1);
      // pommel
      out += ci(sx, sy+30, 3, NEON_Y, INK, 1);
      // sparkle
      out += `<text x="${sx+8}" y="${sy-14}" font-size="6" fill="${WHITE}">*</text>`;
    }
  }
  return out;
}

/* =========================================================
   COMPOSE avatar SVG
   ========================================================= */
function buildAvatarInner(includeScene = true) {
  const s = state;
  let out = "";
  if (includeScene) out += drawScene(s.scene);
  // props that go behind body
  out += drawProp(s.prop, "back");
  // body
  out += drawBody(s.outfit, s.outfitColor, s.skin);
  // hair back layer for long/pigtails/ponytail is baked into drawHair
  out += drawHead(s.skin);
  out += drawHair(s.hair, s.hairColor);
  out += drawEyes(s.eyes);
  out += drawMouth(s.mouth);
  out += drawHat(s.hat, s.hair);
  // props in front
  out += drawProp(s.prop, "front");
  return out;
}

function render() {
  const svg = document.getElementById("avatarSvg");
  svg.innerHTML = buildAvatarInner(true);
}

/* =========================================================
   Build controls
   ========================================================= */
function labelize(s) { return s.replace(/_/g, " ").toUpperCase(); }

function makeSwatches(group, entries, isColor) {
  const container = document.querySelector(`.grid[data-group="${group}"]`);
  container.innerHTML = "";
  entries.forEach(([key, label, previewColor]) => {
    const el = document.createElement("button");
    el.className = "swatch";
    el.dataset.key = key;
    if (isColor) {
      el.innerHTML = `<div class="chip" style="background:${previewColor}"></div><div>${label}</div>`;
    } else {
      el.innerHTML = `<div>${label}</div>`;
    }
    if (state[group] === key) el.classList.add("active");
    el.addEventListener("click", () => {
      state[group] = key;
      container.querySelectorAll(".swatch").forEach(s => s.classList.remove("active"));
      el.classList.add("active");
      render();
    });
    container.appendChild(el);
  });
}

function initControls() {
  makeSwatches("skin", Object.entries(SKIN_COLORS).map(([k,v]) => [k, labelize(k), v]), true);

  makeSwatches("eyes", EYE_STYLES.map(s => [s, labelize(s)]));

/* tabs */
document.getElementById("tabs").addEventListener("click", (e) => {

/* =========================================================
   RESULT POSTER — retro grid baked into the poster background
   ========================================================= */
function posterGridBackground() {
  // full-poster retro grid + gradient sky
  let out = "";
  out += `<defs>
    <linearGradient id="pSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0028"/>
      <stop offset="0.6" stop-color="#4a0a5a"/>
      <stop offset="1" stop-color="#a02040"/>
    </linearGradient>
    <linearGradient id="pGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22004a"/>
      <stop offset="1" stop-color="#0a0018"/>
    </linearGradient>
    <linearGradient id="pTitle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe94d"/>
      <stop offset="1" stop-color="#ff7a00"/>
    </linearGradient>
  </defs>`;
  // sky
  out += `<rect x="0" y="0" width="800" height="720" fill="url(#pSky)"/>`;
  // ground
  out += `<rect x="0" y="716" width="800" height="8" fill="#ff4dff"/>`;
  out += `<rect x="0" y="724" width="800" height="276" fill="url(#pGround)"/>`;
  // horizontal grid lines (perspective)
  for (let i = 1; i <= 12; i++) {
    const t = i / 12;
    const y = 724 + Math.pow(t, 1.7) * 276;
    if (y > 1000) break;
    out += `<line x1="0" y1="${y}" x2="800" y2="${y}" stroke="#ff4dff" stroke-width="1.5" opacity="${0.35 + t*0.5}"/>`;
  }
  // vertical converging lines
  for (let i = -14; i <= 14; i++) {
    const bx = 400 + i * 65;
    out += `<line x1="${bx}" y1="1000" x2="400" y2="720" stroke="#ff4dff" stroke-width="1.2" opacity="0.7"/>`;
  }
  // stars
  const stars = [[60,60],[120,40],[200,90],[300,50],[500,70],[600,110],[680,40],[740,80],[80,180],[720,180],[40,260]];
  for (const [x,y] of stars) {
    out += `<rect x="${x}" y="${y}" width="4" height="4" fill="#ffe94d"/>`;
  }
  return out;
}

/* =========================================================
   DOWNLOAD PNG
   ========================================================= */
function downloadPoster() {
  const posterSvg = document.getElementById("posterSvg");
  if (!posterSvg) return;
  const clone = posterSvg.cloneNode(true);
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  const svgStr = new XMLSerializer().serializeToString(clone);
  const svgBlob = new Blob([svgStr], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(svgBlob);

  const img = new Image();
  img.onload = function () {
    const scale = 2;
    const canvas = document.createElement("canvas");
    canvas.width = 800 * scale;
    canvas.height = 1000 * scale;
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    canvas.toBlob((blob) => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "spookfest-avatar.png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }, "image/png");
  };
  img.onerror = function () {
    alert("Couldn't render the PNG in this browser. Screenshot the poster instead.");
  };
  img.src = url;
}
document.getElementById("downloadBtn").addEventListener("click", downloadPoster);
