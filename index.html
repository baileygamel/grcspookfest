<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GRC Barcade Avatar Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Mulish:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #00dce9;
    --cyan-dark: #00a0aa;
    --cyan-glow: rgba(0, 220, 233, 0.5);
    --magenta: #ff3499;
    --magenta-dark: #c81a70;
    --magenta-glow: rgba(255, 52, 153, 0.5);
    --orange: #ffa84f;
    --orange-dark: #d47a20;
    --orange-glow: rgba(255, 168, 79, 0.5);
    --navy: #050c1a;
    --navy-2: #0a1526;
    --navy-3: #12283f;
    --navy-4: #1e4a70;
    --navy-panel: rgba(10, 21, 38, 0.85);
    --navy-border: #1e4a70;
    --ink: #eef4fa;
    --ink-dim: #a0c0d8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: "Mulish", "Helvetica Neue", sans-serif;
    color: var(--ink);
    overflow-x: hidden;
    background:
      radial-gradient(ellipse at 20% 5%, rgba(0,220,233,0.14), transparent 55%),
      radial-gradient(ellipse at 85% 95%, rgba(255,52,153,0.10), transparent 55%),
      linear-gradient(180deg, #050c1a 0%, #0a1526 40%, #12283f 75%, #050c1a 100%);
    background-attachment: fixed;
  }
  h1, h2, h3 { font-family: "Merriweather", Georgia, serif; letter-spacing: 0; }

  header { text-align: center; padding: 32px 16px 6px; }
  header h1 {
    margin: 0;
    font-size: clamp(24px, 4vw, 42px);
    font-weight: 900;
    color: var(--ink);
    letter-spacing: 0.5px;
  }
  header h1 .brand { color: var(--cyan); }
  header .sub {
    margin-top: 10px;
    color: var(--ink-dim);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .event-picker {
    display: flex; justify-content: center; gap: 10px;
    max-width: 900px; margin: 18px auto 8px; padding: 0 16px;
    flex-wrap: wrap;
  }
  .event-btn {
    padding: 10px 18px;
    font-family: "Mulish", sans-serif;
    font-size: 13px; font-weight: 700;
    color: var(--ink);
    background: rgba(10,21,38,0.7);
    border: 2px solid var(--navy-border);
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.15s ease;
  }
  .event-btn:hover { border-color: var(--cyan); transform: translateY(-1px); }
  .event-btn.active {
    background: var(--cyan); color: var(--navy);
    border-color: var(--cyan);
    box-shadow: 0 0 20px var(--cyan-glow);
  }

  .mode-picker {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
    max-width: 700px; margin: 18px auto 12px; padding: 0 16px;
  }
  .mode-card {
    padding: 18px 14px;
    background: rgba(10,21,38,0.7);
    border: 2px solid var(--navy-border);
    border-radius: 16px;
    cursor: pointer; text-align: center;
    transition: all 0.15s ease;
  }
  .mode-card:hover { transform: translateY(-2px); border-color: var(--cyan); }
  .mode-card.active {
    border-color: var(--cyan);
    background: rgba(0,220,233,0.12);
    box-shadow: 0 6px 24px rgba(0,220,233,0.25);
  }
  .mode-card .mode-emoji { font-size: 32px; display: block; margin-bottom: 6px; }
  .mode-card .mode-title {
    font-family: "Merriweather", Georgia, serif;
    font-weight: 700; font-size: 15px; color: var(--ink);
    margin-bottom: 4px;
  }
  .mode-card .mode-sub { font-size: 12px; color: var(--ink-dim); }

  #app { max-width: 1180px; margin: 0 auto; padding: 10px 16px 48px; }
  .view { display: none; }
  .view.active { display: block; }

  /* ========== PRESET GALLERY — rectangular panel style ========== */
  .preset-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
    max-width: 1100px; margin: 0 auto;
  }
  .preset-card {
    background: transparent;
    border: 3px solid transparent;
    border-radius: 16px;
    padding: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .preset-card:hover { transform: translateY(-3px); }
  .preset-card.selected {
    border-color: var(--neon, var(--cyan));
    box-shadow: 0 0 24px var(--neon-glow, var(--cyan-glow));
  }
  .preset-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    border-radius: 12px;
    overflow: hidden;
    background: var(--panel-gradient, linear-gradient(135deg, #00dce9, #00a0aa));
    display: flex; flex-direction: column;
    align-items: stretch; justify-content: flex-end;
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
  }
  .preset-frame .img-wrap {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 12px 8px 4px;
    position: relative;
  }
  .preset-frame img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .preset-frame.missing::before {
    content: "Drop " attr(data-src) " into /presets/";
    display: flex; align-items: center; justify-content: center;
    color: rgba(10,21,38,0.7);
    font-family: "Mulish", sans-serif;
    font-size: 11px;
    font-weight: 700;
    padding: 12px;
    text-align: center;
    flex: 1;
  }
  .preset-frame.missing img { display: none; }
  .preset-frame .label {
    background: #050c1a;
    padding: 8px 6px 6px;
    text-align: center;
    border-top: 2px solid var(--neon, var(--cyan));
  }
  .preset-frame .label .name {
    font-family: "Merriweather", Georgia, serif;
    font-weight: 900;
    font-size: 12px;
    color: var(--neon, var(--cyan));
    text-transform: uppercase;
    letter-spacing: 1.5px;
    text-shadow: 0 0 6px var(--neon-glow, var(--cyan-glow));
    display: block;
  }
  .preset-frame .label .tag {
    margin-top: 2px;
    font-family: "Mulish", sans-serif;
    font-weight: 600;
    font-size: 10px;
    color: var(--ink-dim);
    line-height: 1.3;
    display: block;
  }

  /* ========== VARIANT PANEL ========== */
  .variant-panel {
    max-width: 1100px;
    margin: 22px auto 0;
    padding: 18px;
    background: var(--navy-panel);
    border: 2px solid var(--navy-border);
    border-radius: 16px;
  }
  .variant-panel h3 {
    margin: 0 0 14px;
    font-family: "Merriweather", Georgia, serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--neon, var(--cyan));
    letter-spacing: 1px;
    text-align: center;
    text-shadow: 0 0 8px var(--neon-glow, var(--cyan-glow));
  }
  .variant-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 10px;
  }
  .variant-swatch {
    padding: 8px 4px 6px;
    background: rgba(30,74,112,0.35);
    border: 2px solid var(--navy-border);
    border-radius: 12px;
    cursor: pointer;
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    color: var(--ink);
    transition: all 0.08s ease;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    position: relative;
  }
  .variant-swatch:hover { transform: translateY(-2px); border-color: var(--neon, var(--cyan)); }
  .variant-swatch.active {
    border-color: var(--neon, var(--cyan));
    background: rgba(0,220,233,0.14);
    box-shadow: 0 0 12px var(--neon-glow, var(--cyan-glow));
  }
  .variant-thumb {
    position: relative;
    width: 68px; height: 68px;
    border-radius: 10px;
    overflow: hidden;
    background: linear-gradient(135deg, #12283f, #050c1a);
    display: flex; align-items: center; justify-content: center;
  }
  .variant-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .variant-thumb.missing::after {
    content: "—";
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-dim);
    font-size: 20px;
  }
  .variant-thumb.missing img { display: none; }
  .variant-swatch.active::after {
    content: "✓";
    position: absolute; top: 3px; right: 5px;
    font-size: 11px; color: var(--neon, var(--cyan));
  }

  .photo-upload { max-width: 500px; margin: 0 auto; text-align: center; }
  .drop-zone {
    padding: 40px 20px;
    border: 3px dashed var(--navy-border);
    border-radius: 20px;
    background: var(--navy-panel);
    cursor: pointer; transition: all 0.15s ease;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--cyan);
    background: rgba(0,220,233,0.08);
  }
  .drop-zone .icon { font-size: 48px; display: block; margin-bottom: 12px; }
  .drop-zone p { margin: 4px 0; color: var(--ink); }
  .drop-zone p.sub { font-size: 13px; color: var(--ink-dim); }
  #photoInput { display: none; }
  .photo-preview { margin-top: 20px; display: none; }
  .photo-preview.show { display: block; }
  .photo-preview img {
    width: 100%; max-width: 320px; aspect-ratio: 1;
    object-fit: cover; border-radius: 20px;
    border: 3px solid var(--cyan);
    box-shadow: 0 0 30px var(--cyan-glow);
  }

  .go-btn {
    display: block; width: 100%; max-width: 400px; margin: 22px auto 0;
    padding: 18px;
    font-family: "Merriweather", Georgia, serif;
    font-weight: 900; font-size: 16px;
    color: var(--navy);
    background: linear-gradient(135deg, var(--cyan), var(--magenta));
    border: none; border-radius: 14px;
    cursor: pointer; letter-spacing: 1px;
    box-shadow: 0 6px 24px rgba(0,220,233,0.4), 0 0 40px rgba(255,52,153,0.25);
    transition: all 0.15s ease;
  }
  .go-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(0,220,233,0.55), 0 0 50px rgba(255,52,153,0.4); }
  .go-btn:active { transform: translateY(2px); }

  #result { display: none; }
  #result.show { display: block; }
  .poster-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  #poster {
    width: 100%; max-width: 720px; aspect-ratio: 4 / 5;
    background: var(--navy); border-radius: 20px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 40px rgba(0,220,233,0.3);
  }
  #poster svg { width: 100%; height: 100%; display: block; }
  .poster-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    padding: 14px 22px;
    font-family: "Merriweather", Georgia, serif;
    font-weight: 700; font-size: 14px;
    border-radius: 12px; cursor: pointer;
    border: 2px solid; text-decoration: none; display: inline-block;
    letter-spacing: 0.5px;
    transition: all 0.15s ease;
  }
  .btn.primary {
    background: linear-gradient(135deg, var(--cyan), var(--magenta));
    color: var(--navy);
    border-color: transparent;
    box-shadow: 0 6px 24px rgba(0,220,233,0.4);
  }
  .btn.primary:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(0,220,233,0.55); }
  .btn.secondary {
    background: transparent; color: var(--ink);
    border-color: var(--navy-border);
  }
  .btn.secondary:hover { border-color: var(--cyan); }
  .footnote { color: var(--ink-dim); font-size: 13px; text-align: center; max-width: 520px; margin-top: 4px; }
</style>
</head>
<body>

<header>
  <h1><span class="brand">GRC BARCADE</span> AVATAR MAKER</h1>
  <div class="sub">Make your fit &middot; Share your city</div>
</header>

<div class="event-picker" id="eventPicker">
  <button class="event-btn active" data-event="denver">DENVER &middot; OCT 21</button>
  <button class="event-btn" data-event="seattle">SEATTLE &middot; NOV 3</button>
  <button class="event-btn" data-event="atlanta">ATLANTA &middot; NOV 12</button>
  <button class="event-btn" data-event="chicago">CHICAGO &middot; DEC 3</button>
</div>

<div class="mode-picker" id="modePicker">
  <div class="mode-card active" data-mode="preset">
    <span class="mode-emoji">🎮</span>
    <div class="mode-title">Pick a Character</div>
    <div class="mode-sub">15 GRC crew avatars</div>
  </div>
  <div class="mode-card" data-mode="photo">
    <span class="mode-emoji">📸</span>
    <div class="mode-title">Upload Your Photo</div>
    <div class="mode-sub">The real you</div>
  </div>
</div>

<main id="app">
  <section id="view-preset" class="view active">
    <div class="preset-gallery" id="presetGallery"></div>

    <div class="variant-panel" id="variantPanel">
      <h3 id="variantHeading">Choose your look</h3>
      <div class="variant-grid" id="variantGrid"></div>
    </div>

    <button class="go-btn" id="presetGoBtn">I'M GOING! &nbsp;→</button>
  </section>

  <section id="view-photo" class="view">
    <div class="photo-upload">
      <label class="drop-zone" id="dropZone" for="photoInput">
        <span class="icon">📸</span>
        <p><strong>Click to upload</strong> or drag a photo here</p>
        <p class="sub">JPG or PNG &middot; square works best</p>
      </label>
      <input type="file" id="photoInput" accept="image/*">
      <div class="photo-preview" id="photoPreview">
        <img id="photoImg" alt="Your photo">
        <button class="go-btn" id="photoGoBtn">I'M GOING! &nbsp;→</button>
      </div>
    </div>
  </section>

  <section id="result">
    <div class="poster-wrap">
      <div id="poster"></div>
      <div class="poster-actions">
        <button class="btn primary" id="downloadBtn">Download PNG</button>
        <button class="btn secondary" id="editBtn">← Back to Edit</button>
      </div>
      <p class="footnote">Save the PNG and drop it in the shared marketing folder, or screenshot to share.</p>
    </div>
  </section>
</main>

<script>
/* =========================================================
   GRC Barcade Avatar Maker — image-preset edition
   IMPORTANT: preset PNGs are used AS-IS. No recoloring,
   filtering, or generative modification. Only OVERLAY assets
   sit above the preset without altering it.
   Drop transparent PNGs into /presets/{key}.png
   ========================================================= */

const BRAND = {
  cyan: "#00dce9",
  magenta: "#ff3499",
  orange: "#ffa84f",
  navy: "#050c1a",
  navy2: "#0a1526",
  navy3: "#12283f",
  navy4: "#1e4a70",
};
const INK = "#28083a";
const WHITE = "#faf3ff";

const EVENTS = {
  denver:  { city: "DENVER",  date: "OCTOBER 21ST" },
  seattle: { city: "SEATTLE", date: "NOVEMBER 3RD" },
  atlanta: { city: "ATLANTA", date: "NOVEMBER 12TH" },
  chicago: { city: "CHICAGO", date: "DECEMBER 3RD" },
};

/* -----------------------------------------------------------
   VARIANT SETS — the app looks for files at
     presets/{characterKey}/{variantKey}.png
   Full variant set for people characters:
----------------------------------------------------------- */
const VARIANT_SETS = {
  human: [
    { key: "base",       label: "Base"        },
    { key: "fair",       label: "Fair"        },
    { key: "light",      label: "Light"       },
    { key: "medium",     label: "Medium"      },
    { key: "olive",      label: "Olive"       },
    { key: "tan",        label: "Tan"         },
    { key: "deep",       label: "Deep"        },
    { key: "ebony",      label: "Ebony"       },
    { key: "red",        label: "Red Hair"    },
    { key: "blue",       label: "Blue Hair"   },
    { key: "purple",     label: "Purple Hair" },
    { key: "pink-ombre", label: "Pink Ombré"  },
    { key: "curly",      label: "Curly"       },
    { key: "locs",       label: "Locs"        },
    { key: "space-buns", label: "Space Buns"  },
    { key: "half-up",    label: "Half Up"     },
    { key: "short",      label: "Short"       },
    { key: "sleek",      label: "Sleek"       },
    { key: "braids",     label: "Braids"      },
    { key: "natural",    label: "Natural"     },
  ],
  mascot: [
    { key: "base",   label: "Base"  },
  ],
};

/* -----------------------------------------------------------
   PRESETS — drop matching PNG into presets/{key}/{variant}.png
   The card in the gallery shows presets/{key}/base.png.
   Each has a panel gradient (background of the card) + neon
   accent color (border + label text) + a variantSet.
----------------------------------------------------------- */
const PANEL = {
  magenta: "linear-gradient(135deg, #ff3499, #c81a70)",
  cyan:    "linear-gradient(135deg, #00dce9, #00a0aa)",
  orange:  "linear-gradient(135deg, #ffa84f, #d47a20)",
  purple:  "linear-gradient(135deg, #a94dff, #6a2fbf)",
};
const NEON = {
  magenta: { c: BRAND.magenta, glow: "rgba(255,52,153,0.6)" },
  cyan:    { c: BRAND.cyan,    glow: "rgba(0,220,233,0.6)" },
  orange:  { c: BRAND.orange,  glow: "rgba(255,168,79,0.6)" },
  purple:  { c: "#a94dff",     glow: "rgba(169,77,255,0.6)" },
};

const PRESETS = [
  { key: "trusty",        name: "Trusty",        tag: "Keeps things on track",              panel: "magenta", neon: "magenta", variantSet: "human"  },
  { key: "audit-ace",     name: "Audit Ace",     tag: "Checks. Clears. Celebrates.",        panel: "cyan",    neon: "cyan",    variantSet: "human"  },
  { key: "risky",         name: "Risky",         tag: "Spots issues before they spawn",     panel: "orange",  neon: "orange",  variantSet: "human"  },
  { key: "compli-bot",    name: "Compli Bot",    tag: "Always up for a high score",         panel: "cyan",    neon: "cyan",    variantSet: "mascot" },
  { key: "control-freak", name: "Control Freak", tag: "Process protects progress",          panel: "magenta", neon: "magenta", variantSet: "mascot" },
  { key: "the-strategist",name: "The Strategist",tag: "Big picture. Bigger possibilities.", panel: "purple",  neon: "purple",  variantSet: "human"  },
  { key: "the-builder",   name: "The Builder",   tag: "Turns ideas into impact",            panel: "magenta", neon: "magenta", variantSet: "human"  },
  { key: "the-guardian",  name: "The Guardian",  tag: "Protects what matters",              panel: "orange",  neon: "orange",  variantSet: "mascot" },
  { key: "the-explorer",  name: "The Explorer",  tag: "Discovers what's next",              panel: "purple",  neon: "purple",  variantSet: "mascot" },
  { key: "the-analyst",   name: "The Analyst",   tag: "Finds the signal",                   panel: "cyan",    neon: "cyan",    variantSet: "human"  },
  { key: "the-maverick",  name: "The Maverick",  tag: "Challenges the status quo",          panel: "orange",  neon: "orange",  variantSet: "human"  },
  { key: "the-auditor",   name: "The Auditor",   tag: "Asks the tough questions",           panel: "cyan",    neon: "cyan",    variantSet: "human"  },
  { key: "the-champ",     name: "The Champ",     tag: "Brings people together",             panel: "magenta", neon: "magenta", variantSet: "human"  },
  { key: "the-innovator", name: "The Innovator", tag: "Turns complexity into opportunity",  panel: "orange",  neon: "orange",  variantSet: "human"  },
  { key: "the-oracle",    name: "The Oracle",    tag: "Sees ahead",                         panel: "purple",  neon: "purple",  variantSet: "mascot" },
];
const presetSrc = (p, variantKey = "base") => `presets/${p.key}/${variantKey}.png`;
const variantsFor = (p) => VARIANT_SETS[p.variantSet] || VARIANT_SETS.mascot;

/* -----------------------------------------------------------
   OVERLAYS — sit ON TOP of the preset image, never modify it.
   Each has a preview icon (for the picker) and a poster-scale
   render (positioned in the poster's avatar area).
   Anchor positions assume the preset avatar fills the avatar
   box roughly: head near top-center, chest lower-middle.
----------------------------------------------------------- */
const OVERLAYS = [
  {
    key: "shades",
    label: "Pixel Shades",
    icon: () => `
      <rect x="4" y="18" width="12" height="8" fill="#0a0018"/>
      <rect x="24" y="18" width="12" height="8" fill="#0a0018"/>
      <rect x="16" y="20" width="8" height="2" fill="#0a0018"/>
      <rect x="6" y="20" width="3" height="2" fill="#00dce9"/>
      <rect x="26" y="20" width="3" height="2" fill="#00dce9"/>
    `,
    poster: (ax, ay, sz) => {
      // ~1/3 down from top, ~1/2 head width
      const w = sz * 0.42, h = sz * 0.08;
      const x = ax + (sz - w) / 2, y = ay + sz * 0.32;
      return `
        <rect x="${x}" y="${y}" width="${w*0.44}" height="${h}" fill="#0a0018"/>
        <rect x="${x + w*0.56}" y="${y}" width="${w*0.44}" height="${h}" fill="#0a0018"/>
        <rect x="${x + w*0.44}" y="${y + h*0.35}" width="${w*0.12}" height="${h*0.3}" fill="#0a0018"/>
        <rect x="${x + w*0.06}" y="${y + h*0.15}" width="${w*0.08}" height="${h*0.4}" fill="${BRAND.cyan}"/>
        <rect x="${x + w*0.62}" y="${y + h*0.15}" width="${w*0.08}" height="${h*0.4}" fill="${BRAND.cyan}"/>
      `;
    },
  },
  {
    key: "grcCap",
    label: "GRC Cap",
    icon: () => `
      <path d="M 5 24 Q 5 12 20 10 Q 35 12 35 24 Q 35 26 35 27 Q 20 22 5 27 Q 5 25 5 24 Z" fill="#00dce9"/>
      <path d="M 35 25 Q 39 27 39 29 Q 39 30 37 30 Q 35 27 35 26 Z" fill="#00dce9"/>
      <rect x="15" y="14" width="10" height="6" rx="1" fill="#fff"/>
      <text x="20" y="19" text-anchor="middle" font-family="Mulish" font-weight="900" font-size="4" fill="#050c1a">GRC</text>
    `,
    poster: (ax, ay, sz) => {
      const cw = sz * 0.55, ch = sz * 0.18;
      const cx = ax + (sz - cw) / 2, cy = ay + sz * 0.02;
      return `
        <path d="M ${cx} ${cy + ch*0.75}
                 Q ${cx} ${cy + ch*0.2} ${cx + cw/2} ${cy + ch*0.1}
                 Q ${cx + cw} ${cy + ch*0.2} ${cx + cw} ${cy + ch*0.75}
                 Q ${cx + cw} ${cy + ch*0.9} ${cx + cw/2} ${cy + ch*0.75}
                 Q ${cx} ${cy + ch*0.9} ${cx} ${cy + ch*0.75} Z" fill="${BRAND.cyan}" stroke="#050c1a" stroke-width="2.4"/>
        <path d="M ${cx + cw} ${cy + ch*0.82} Q ${cx + cw*1.2} ${cy + ch*0.95} ${cx + cw*1.2} ${cy + ch*1.05} Q ${cx + cw*1.2} ${cy + ch*1.1} ${cx + cw*1.05} ${cy + ch*1.1} Q ${cx + cw} ${cy + ch*0.95} ${cx + cw} ${cy + ch*0.9} Z" fill="${BRAND.cyan}" stroke="#050c1a" stroke-width="2.4"/>
        <rect x="${cx + cw*0.35}" y="${cy + ch*0.35}" width="${cw*0.3}" height="${ch*0.4}" rx="4" fill="#fff" stroke="#050c1a" stroke-width="1.4"/>
        <text x="${cx + cw*0.5}" y="${cy + ch*0.65}" text-anchor="middle" font-family="Mulish, sans-serif" font-weight="900" font-size="${sz*0.055}" fill="#050c1a">GRC</text>
      `;
    },
  },
  {
    key: "witchHat",
    label: "Witch Hat",
    icon: () => `
      <ellipse cx="20" cy="30" rx="18" ry="3" fill="#141026"/>
      <path d="M 10 28 L 20 4 L 30 28 Z" fill="#141026"/>
      <rect x="12" y="25" width="16" height="3" fill="#ff3499"/>
      <rect x="18" y="24" width="4" height="4" fill="#ffa84f"/>
    `,
    poster: (ax, ay, sz) => {
      const hw = sz * 0.7, hh = sz * 0.35;
      const hx = ax + (sz - hw)/2;
      const hy = ay - sz * 0.05;
      return `
        <ellipse cx="${hx + hw/2}" cy="${hy + hh}" rx="${hw/2}" ry="${sz*0.04}" fill="#141026" stroke="#050c1a" stroke-width="2"/>
        <path d="M ${hx + hw*0.28} ${hy + hh} L ${hx + hw/2} ${hy} L ${hx + hw*0.72} ${hy + hh} Z" fill="#141026" stroke="#050c1a" stroke-width="2"/>
        <path d="M ${hx + hw*0.34} ${hy + hh*0.82} L ${hx + hw*0.66} ${hy + hh*0.82} L ${hx + hw*0.7} ${hy + hh*0.95} L ${hx + hw*0.3} ${hy + hh*0.95} Z" fill="${BRAND.magenta}"/>
        <rect x="${hx + hw*0.45}" y="${hy + hh*0.78}" width="${hw*0.1}" height="${hw*0.1}" fill="${BRAND.orange}" stroke="#050c1a" stroke-width="1"/>
      `;
    },
  },
  {
    key: "grcBandana",
    label: "GRC Bandana",
    icon: () => `
      <path d="M 4 12 L 36 12 L 32 24 L 20 28 L 8 24 Z" fill="#ff3499"/>
      <text x="20" y="21" text-anchor="middle" font-family="Mulish" font-weight="900" font-size="6" fill="#fff">GRC</text>
    `,
    poster: (ax, ay, sz) => {
      const w = sz * 0.9, h = sz * 0.14;
      const x = ax + (sz - w)/2, y = ay + sz * 0.06;
      return `
        <path d="M ${x} ${y} L ${x + w} ${y} L ${x + w*0.86} ${y + h} L ${x + w/2} ${y + h*1.3} L ${x + w*0.14} ${y + h} Z" fill="${BRAND.magenta}" stroke="#050c1a" stroke-width="2"/>
        <text x="${x + w/2}" y="${y + h*0.8}" text-anchor="middle" font-family="Mulish, sans-serif" font-weight="900" font-size="${sz*0.06}" fill="#fff">GRC</text>
        <path d="M ${x + w*0.1} ${y + h*0.35} L ${x + w*0.9} ${y + h*0.35}" stroke="#c81a70" stroke-width="1.6"/>
      `;
    },
  },
  {
    key: "grcBadge",
    label: "GRC Badge",
    icon: () => `
      <rect x="10" y="8" width="20" height="14" rx="2" fill="#00dce9" stroke="#050c1a" stroke-width="1"/>
      <text x="20" y="18" text-anchor="middle" font-family="Mulish" font-weight="900" font-size="7" fill="#050c1a">GRC</text>
      <rect x="18" y="22" width="4" height="10" fill="#ff3499"/>
    `,
    poster: (ax, ay, sz) => {
      const w = sz * 0.28, h = sz * 0.16;
      const x = ax + sz * 0.68, y = ay + sz * 0.55;
      return `
        <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${BRAND.cyan}" stroke="#050c1a" stroke-width="2"/>
        <text x="${x + w/2}" y="${y + h*0.7}" text-anchor="middle" font-family="Mulish, sans-serif" font-weight="900" font-size="${sz*0.055}" fill="#050c1a">GRC</text>
        <rect x="${x + w*0.35}" y="${y + h}" width="${w*0.3}" height="${sz*0.09}" fill="${BRAND.magenta}"/>
        <path d="M ${x + w*0.35} ${y + h + sz*0.09} L ${x + w*0.5} ${y + h + sz*0.065} L ${x + w*0.65} ${y + h + sz*0.09} Z" fill="${BRAND.magenta}"/>
      `;
    },
  },
  {
    key: "pixelHeart",
    label: "Pixel Heart",
    icon: () => `
      <g transform="translate(8 8) scale(2.5)">
        <rect x="0" y="1" width="2" height="2" fill="#ff3499"/>
        <rect x="2" y="0" width="2" height="2" fill="#ff3499"/>
        <rect x="4" y="1" width="2" height="2" fill="#ff3499"/>
        <rect x="2" y="1" width="2" height="2" fill="#ff3499"/>
        <rect x="0" y="3" width="6" height="2" fill="#ff3499"/>
        <rect x="1" y="5" width="4" height="2" fill="#ff3499"/>
        <rect x="2" y="7" width="2" height="1" fill="#ff3499"/>
      </g>
    `,
    poster: (ax, ay, sz) => {
      const unit = sz * 0.03;
      const bx = ax + sz * 0.06, by = ay + sz * 0.06;
      let s = "";
      const map = [
        [0,1],[1,0],[2,1],[1,1],
        [0,2],[1,2],[2,2],[3,1],[4,0],[5,1],[4,1],[3,2],[4,2],[5,2],
        [0,3],[1,3],[2,3],[3,3],[4,3],[5,3],
        [1,4],[2,4],[3,4],[4,4],
        [2,5],[3,5],
      ];
      for (const [x, y] of map) {
        s += `<rect x="${bx + x*unit}" y="${by + y*unit}" width="${unit}" height="${unit}" fill="${BRAND.magenta}"/>`;
      }
      return s;
    },
  },
];

const state = {
  mode: "preset",
  event: "denver",
  presetKey: PRESETS[0].key,
  presetVariant: "base",
  photoDataUrl: null,
  overlays: new Set(),
};

/* -----------------------------------------------------------
   Preset gallery rendering
----------------------------------------------------------- */
function renderPresetCards() {
  const gallery = document.getElementById("presetGallery");
  gallery.innerHTML = "";
  for (const p of PRESETS) {
    const src = presetSrc(p, "base");
    const card = document.createElement("div");
    card.className = "preset-card" + (state.presetKey === p.key ? " selected" : "");
    card.dataset.key = p.key;
    const neon = NEON[p.neon] || NEON.cyan;
    const panel = PANEL[p.panel] || PANEL.cyan;
    card.style.setProperty("--neon", neon.c);
    card.style.setProperty("--neon-glow", neon.glow);
    card.style.setProperty("--panel-gradient", panel);
    card.innerHTML = `
      <div class="preset-frame" data-src="${p.key}/base.png">
        <div class="img-wrap">
          <img src="${src}" alt="${p.name}"
               onerror="this.parentElement.parentElement.classList.add('missing')">
        </div>
        <div class="label">
          <span class="name">${p.name}</span>
          <span class="tag">${p.tag}</span>
        </div>
      </div>
    `;
    card.addEventListener("click", () => {
      state.presetKey = p.key;
      state.presetVariant = "base";
      gallery.querySelectorAll(".preset-card").forEach(c => c.classList.remove("selected"));
      card.classList.add("selected");
      renderVariantPicker();
    });
    gallery.appendChild(card);
  }
  renderVariantPicker();
}

function renderVariantPicker() {
  const panel = document.getElementById("variantPanel");
  if (!panel) return;
  const preset = PRESETS.find(x => x.key === state.presetKey) || PRESETS[0];
  const variants = variantsFor(preset);
  const neon = NEON[preset.neon] || NEON.cyan;
  panel.style.setProperty("--neon", neon.c);
  panel.style.setProperty("--neon-glow", neon.glow);
  const heading = document.getElementById("variantHeading");
  if (heading) heading.textContent = `${preset.name} — Choose your look`;
  const grid = document.getElementById("variantGrid");
  grid.innerHTML = "";
  for (const v of variants) {
    const btn = document.createElement("button");
    btn.className = "variant-swatch" + (state.presetVariant === v.key ? " active" : "");
    btn.dataset.key = v.key;
    btn.innerHTML = `
      <div class="variant-thumb">
        <img src="${presetSrc(preset, v.key)}" alt="${v.label}"
             onerror="this.parentElement.classList.add('missing')">
      </div>
      <span>${v.label}</span>
    `;
    btn.addEventListener("click", () => {
      state.presetVariant = v.key;
      grid.querySelectorAll(".variant-swatch").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    });
    grid.appendChild(btn);
  }
}

/* -----------------------------------------------------------
   Overlay picker
----------------------------------------------------------- */
function renderOverlayPicker() {
  const grid = document.getElementById("overlayGrid");
  grid.innerHTML = "";
  for (const o of OVERLAYS) {
    const btn = document.createElement("button");
    btn.className = "overlay-swatch" + (state.overlays.has(o.key) ? " active" : "");
    btn.dataset.key = o.key;
    btn.innerHTML = `
      <svg viewBox="0 0 40 40">${o.icon()}</svg>
      <div>${o.label}</div>
    `;
    btn.addEventListener("click", () => {
      if (state.overlays.has(o.key)) state.overlays.delete(o.key);
      else state.overlays.add(o.key);
      btn.classList.toggle("active");
    });
    grid.appendChild(btn);
  }
}

/* -----------------------------------------------------------
   Mode + event pickers
----------------------------------------------------------- */
document.getElementById("modePicker").addEventListener("click", (e) => {
  const card = e.target.closest(".mode-card");
  if (!card) return;
  document.querySelectorAll(".mode-card").forEach(c => c.classList.remove("active"));
  card.classList.add("active");
  state.mode = card.dataset.mode;
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(`view-${state.mode}`).classList.add("active");
  document.getElementById("result").classList.remove("show");
});
document.getElementById("eventPicker").addEventListener("click", (e) => {
  const btn = e.target.closest(".event-btn");
  if (!btn) return;
  document.querySelectorAll(".event-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  state.event = btn.dataset.event;
  if (document.getElementById("result").classList.contains("show")) {
    document.getElementById("poster").innerHTML = buildPoster();
  }
});

/* -----------------------------------------------------------
   Photo upload
----------------------------------------------------------- */
const photoInput = document.getElementById("photoInput");
const dropZone = document.getElementById("dropZone");
const photoPreview = document.getElementById("photoPreview");
const photoImg = document.getElementById("photoImg");
function handleFile(file) {
  if (!file || !file.type.startsWith("image/")) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    state.photoDataUrl = e.target.result;
    photoImg.src = state.photoDataUrl;
    photoPreview.classList.add("show");
  };
  reader.readAsDataURL(file);
}
photoInput.addEventListener("change", (e) => handleFile(e.target.files[0]));
dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", (e) => { e.preventDefault(); dropZone.classList.remove("dragover"); handleFile(e.dataTransfer.files[0]); });

/* -----------------------------------------------------------
   Poster
----------------------------------------------------------- */
function buildPoster() {
  const W = 800, H = 1000;
  const evt = EVENTS[state.event];
  const preset = PRESETS.find(x => x.key === state.presetKey) || PRESETS[0];
  const isPhoto = state.mode === "photo";

  // avatar panel dimensions
  const avatarW = 520, avatarH = 560;
  const avatarX = (W - avatarW) / 2;
  const avatarY = 320;

  // Build avatar image source
  let avatarHref = isPhoto ? (state.photoDataUrl || "") : presetSrc(preset, state.presetVariant);

  // Panel gradient stops for the character card background
  const panelStops = {
    magenta: ["#ff3499", "#c81a70"],
    cyan:    ["#00dce9", "#00a0aa"],
    orange:  ["#ffa84f", "#d47a20"],
    purple:  ["#a94dff", "#6a2fbf"],
  };
  const panelColors = isPhoto ? ["#12283f", "#050c1a"] : (panelStops[preset.panel] || panelStops.cyan);
  const neonColors = { magenta: BRAND.magenta, cyan: BRAND.cyan, orange: BRAND.orange, purple: "#a94dff" };
  const neon = isPhoto ? BRAND.cyan : (neonColors[preset.neon] || BRAND.cyan);

  // Overlays (only in preset mode)
  let overlayLayer = "";
  if (!isPhoto) {
    for (const key of state.overlays) {
      const o = OVERLAYS.find(x => x.key === key);
      if (o) overlayLayer += o.poster(avatarX + (avatarW - avatarW*0.9) / 2, avatarY + 20, avatarW * 0.9);
    }
  }

  const clipId = `clip_${Date.now()}`;
  const panelId = `panel_${Date.now()}`;

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" id="posterSvg">
    <defs>
      <linearGradient id="pBg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#050c1a"/>
        <stop offset="0.35" stop-color="#0a1a34"/>
        <stop offset="0.7" stop-color="#173a68"/>
        <stop offset="1" stop-color="#2670b0"/>
      </linearGradient>
      <radialGradient id="pVig" cx="0.5" cy="0.5" r="0.6">
        <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
      </radialGradient>
      <linearGradient id="${panelId}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${panelColors[0]}"/>
        <stop offset="1" stop-color="${panelColors[1]}"/>
      </linearGradient>
      <clipPath id="${clipId}">
        <rect x="${avatarX}" y="${avatarY}" width="${avatarW}" height="${avatarH - 90}" rx="18"/>
      </clipPath>
    </defs>

    <rect x="0" y="0" width="${W}" height="${H}" fill="url(#pBg)"/>
    <!-- bokeh depth -->
    <circle cx="80" cy="220" r="60" fill="${BRAND.cyan}" opacity="0.14"/>
    <circle cx="720" cy="180" r="80" fill="${BRAND.magenta}" opacity="0.14"/>
    <circle cx="120" cy="820" r="90" fill="${BRAND.cyan}" opacity="0.12"/>
    <circle cx="680" cy="880" r="110" fill="${BRAND.magenta}" opacity="0.12"/>
    <rect x="0" y="0" width="${W}" height="${H}" fill="url(#pVig)"/>

    <!-- brand color bars -->
    <rect x="40" y="40" width="80" height="6" fill="${BRAND.cyan}" rx="3"/>
    <rect x="40" y="52" width="40" height="6" fill="${BRAND.magenta}" rx="3"/>
    <rect x="680" y="954" width="80" height="6" fill="${BRAND.magenta}" rx="3"/>
    <rect x="720" y="942" width="40" height="6" fill="${BRAND.orange}" rx="3"/>

    <!-- Title -->
    <text x="${W/2}" y="150" text-anchor="middle" font-family="Merriweather, Georgia, serif" font-weight="700" font-size="26" fill="${BRAND.cyan}" letter-spacing="4">I'M GOING TO THE</text>
    <text x="${W/2}" y="220" text-anchor="middle" font-family="Merriweather, Georgia, serif" font-weight="900" font-size="58" fill="${BRAND.magenta}" style="filter: drop-shadow(0 0 20px rgba(255,52,153,0.55));">${evt.city} GRC</text>
    <text x="${W/2}" y="280" text-anchor="middle" font-family="Merriweather, Georgia, serif" font-weight="900" font-size="58" fill="${BRAND.magenta}" style="filter: drop-shadow(0 0 20px rgba(255,52,153,0.55));">BARCADE</text>

    <!-- Avatar panel card -->
    <rect x="${avatarX - 6}" y="${avatarY - 6}" width="${avatarW + 12}" height="${avatarH + 12}" rx="24" fill="none" stroke="${neon}" stroke-width="4" style="filter: drop-shadow(0 0 26px ${neon}88);"/>
    <rect x="${avatarX}" y="${avatarY}" width="${avatarW}" height="${avatarH - 90}" rx="18" fill="url(#${panelId})"/>
    <!-- Avatar image (UNMODIFIED) -->
    <image href="${avatarHref}" x="${avatarX + 20}" y="${avatarY + 20}" width="${avatarW - 40}" height="${avatarH - 130}" preserveAspectRatio="xMidYMid ${isPhoto ? 'slice' : 'meet'}" clip-path="url(#${clipId})"/>
    <!-- Overlays layered on top -->
    <g clip-path="url(#${clipId})">${overlayLayer}</g>
    <!-- Label plate at bottom of card -->
    <rect x="${avatarX}" y="${avatarY + avatarH - 90}" width="${avatarW}" height="90" fill="#050c1a"/>
    <rect x="${avatarX}" y="${avatarY + avatarH - 90}" width="${avatarW}" height="4" fill="${neon}"/>
    <text x="${W/2}" y="${avatarY + avatarH - 50}" text-anchor="middle" font-family="Merriweather, Georgia, serif" font-weight="900" font-size="26" fill="${neon}" letter-spacing="3" style="filter: drop-shadow(0 0 8px ${neon}aa);">${(isPhoto ? "YOU" : preset.name).toUpperCase()}</text>
    <text x="${W/2}" y="${avatarY + avatarH - 22}" text-anchor="middle" font-family="Mulish, sans-serif" font-weight="600" font-size="14" fill="#a0c0d8">${isPhoto ? "The real you" : preset.tag}</text>

    <!-- Date -->
    <text x="${W/2}" y="925" text-anchor="middle" font-family="Mulish, sans-serif" font-weight="800" font-size="24" fill="${BRAND.orange}" letter-spacing="4">${evt.date}</text>
    <text x="${W/2}" y="960" text-anchor="middle" font-family="Merriweather, Georgia, serif" font-weight="900" font-size="30" fill="${BRAND.cyan}" style="filter: drop-shadow(0 0 12px rgba(0,220,233,0.7));">Join me.</text>
    <text x="${W/2}" y="988" text-anchor="middle" font-family="Mulish, sans-serif" font-weight="700" font-size="11" fill="#a0c0d8" letter-spacing="3">ANECDOTES &middot; GRC BARCADE</text>
  </svg>`;
}

function showResult() {
  if (state.mode === "photo" && !state.photoDataUrl) { alert("Upload a photo first."); return; }
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById("result").classList.add("show");
  document.getElementById("poster").innerHTML = buildPoster();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function showEditor() {
  document.getElementById("result").classList.remove("show");
  document.getElementById(`view-${state.mode}`).classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
}
document.getElementById("presetGoBtn").addEventListener("click", showResult);
document.getElementById("photoGoBtn").addEventListener("click", showResult);
document.getElementById("editBtn").addEventListener("click", showEditor);

/* -----------------------------------------------------------
   PNG download — rasterizes the SVG poster into a PNG.
   Wait for images to load before drawing to canvas.
----------------------------------------------------------- */
function downloadPoster() {
  const posterSvg = document.getElementById("posterSvg");
  if (!posterSvg) return;
  const clone = posterSvg.cloneNode(true);
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  const svgStr = new XMLSerializer().serializeToString(clone);
  const svgBlob = new Blob([svgStr], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = function () {
    const scale = 2;
    const canvas = document.createElement("canvas");
    canvas.width = 800 * scale;
    canvas.height = 1000 * scale;
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    canvas.toBlob((blob) => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "grc-barcade-avatar.png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }, "image/png");
  };
  img.onerror = function () { alert("Couldn't render PNG. Screenshot the poster instead."); };
  img.src = url;
}
document.getElementById("downloadBtn").addEventListener("click", downloadPoster);

renderPresetCards();
</script>
